# Local development stack: PostgreSQL + a mail catcher.
#   docker compose up -d
#   then run the server with `cargo run -p lectern-server -- --config config/lectern.example.toml`
#   and the front-end with `npm run dev` in web/.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lectern
      POSTGRES_PASSWORD: lectern
      POSTGRES_DB: lectern
    ports: ["5432:5432"]
    volumes: [db:/var/lib/postgresql/data]
  mail:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]
volumes:
  db:
