apiVersion: apps/v1
kind: Deployment
metadata:
  name: lectern
spec:
  # One replica: uploaded assets live on a ReadWriteOnce volume. Availability target is
  # 99 % during business hours; a short restart window is acceptable.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/component: server
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lectern
          image: ghcr.io/example/lectern:0.0.0 # replaced by the overlay (tag or digest)
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LECTERN_CONFIG
              value: /etc/lectern/lectern.toml
          envFrom:
            # DATABASE_URL, LECTERN__AUTH__OIDC__CLIENT_SECRET, LECTERN__MAIL__SMTP_URL...
            - secretRef:
                name: lectern-secrets
          volumeMounts:
            - name: config
              mountPath: /etc/lectern
              readOnly: true
            - name: branding
              mountPath: /app/branding
              readOnly: true
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: lectern-config
        - name: branding
          configMap:
            name: lectern-branding
        - name: data
          persistentVolumeClaim:
            claimName: lectern-data
        - name: tmp
          emptyDir: {}
