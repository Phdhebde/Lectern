apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lectern
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  tls:
    - hosts: [academy.example.com]
      secretName: lectern-tls
  rules:
    - host: academy.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lectern
                port:
                  name: http
