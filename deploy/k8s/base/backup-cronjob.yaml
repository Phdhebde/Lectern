# Daily backup of the database and uploaded assets, kept 14 days on a dedicated volume.
# Ship the backup volume off-site (e.g. with your existing backup tooling / object storage).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: lectern-backup
spec:
  schedule: "17 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            # Same group as the server so the assets volume is readable without re-labelling it.
            fsGroup: 65532
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          # The data volume is ReadWriteOnce: schedule next to the server pod.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/component: server
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: backup
              image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
              envFrom:
                - secretRef:
                    name: lectern-secrets
              command:
                - /bin/sh
                - -ec
                - |
                  stamp=$(date +%Y%m%d-%H%M%S)
                  pg_dump --format=custom --no-owner "$DATABASE_URL" > /backups/db-$stamp.dump
                  tar -C /data -czf /backups/assets-$stamp.tar.gz assets
                  find /backups -type f -mtime +14 -delete
                  ls -lh /backups
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 512Mi }
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: backups
                  mountPath: /backups
          volumes:
            - name: tmp
              emptyDir: {}
            - name: data
              persistentVolumeClaim:
                claimName: lectern-data
            - name: backups
              persistentVolumeClaim:
                claimName: lectern-backups
