# Production stack on a single host: PostgreSQL + Lectern (API and front-end in one image)
# + an optional TLS reverse proxy and an on-demand backup job.
#
#   cd deploy/compose
#   cp .env.example .env && cp lectern.env.example lectern.env
#   cp lectern.example.toml lectern.toml                  # then edit the three files
#   docker compose up -d --build
#
# See docs/deploy-compose.md. Base images are pinned by digest (Dependabot proposes updates).
name: lectern

services:
  db:
    image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    restart: unless-stopped
    environment:
      POSTGRES_USER: lectern
      POSTGRES_DB: lectern
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --auth-host=scram-sha-256
    volumes:
      - db:/var/lib/postgresql/data
    # Not published: only reachable from the stack's network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lectern -d lectern"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt: ["no-new-privileges:true"]
    shm_size: 256mb

  lectern:
    image: ${LECTERN_IMAGE:-lectern:local}
    # Built from the repository when LECTERN_IMAGE is not pulled from a registry.
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["serve"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      LECTERN_CONFIG: /etc/lectern/lectern.toml
      DATABASE_URL: postgres://lectern:${POSTGRES_PASSWORD}@db:5432/lectern
      LECTERN__INSTANCE__PUBLIC_URL: ${LECTERN_PUBLIC_URL:?set LECTERN_PUBLIC_URL in .env}
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn}
    # Application secrets (OIDC client secret, SMTP URL): see lectern.env.example.
    env_file: [lectern.env]
    volumes:
      - ./lectern.toml:/etc/lectern/lectern.toml:ro
      - ${LECTERN_BRANDING_DIR:-../../examples/branding}:/app/branding:ro
      - data:/app/data
    tmpfs:
      - /tmp
    # Loopback only: put the bundled proxy (profile "proxy") or your own reverse proxy in front.
    ports:
      - "127.0.0.1:${LECTERN_HTTP_PORT:-8080}:8080"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    # The image is distroless (no shell, no curl): health is checked by the proxy and by
    # monitoring on /readyz.

  proxy:
    profiles: ["proxy"]
    image: nginxinc/nginx-unprivileged:1.29-alpine@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
    restart: unless-stopped
    depends_on: [lectern]
    environment:
      LECTERN_HOST: ${LECTERN_HOST:?set LECTERN_HOST in .env}
      LECTERN_UPSTREAM: lectern:8080
    volumes:
      - ./nginx/lectern.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_CERT_DIR:-./certs}:/etc/nginx/certs:ro
    tmpfs:
      - /tmp
      - /etc/nginx/conf.d:uid=101,gid=101
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  # On demand: `docker compose run --rm backup` (schedule it with cron or a systemd timer).
  backup:
    profiles: ["backup"]
    image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://lectern:${POSTGRES_PASSWORD}@db:5432/lectern
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - data:/data:ro
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        stamp=$$(date +%Y%m%d-%H%M%S)
        pg_dump --format=custom --no-owner "$$DATABASE_URL" > /backups/db-$$stamp.dump
        tar -C /data -czf /backups/assets-$$stamp.tar.gz assets
        find /backups -type f -mtime +"$$RETENTION_DAYS" -delete
        ls -lh /backups
    security_opt: ["no-new-privileges:true"]

volumes:
  db:
  data:
