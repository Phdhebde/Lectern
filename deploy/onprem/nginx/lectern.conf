# /etc/nginx/conf.d/lectern.conf — on-premises reverse proxy for Lectern.
# Replace academy.example.com, the certificate paths and, if the API runs on another
# host, the upstream address. See docs/deploy-onprem.md.
#
# Option B (default here): nginx serves the built front-end from /var/www/lectern/current
# and forwards the server-owned paths to the API.
# Option A: the API serves the front-end too; replace every location below with the
# single `location /` block at the end of this file.

limit_req_zone $binary_remote_addr zone=lectern_site:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=lectern_auth:10m rate=10r/m;
limit_req_status 429;

upstream lectern_api {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name academy.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name academy.example.com;

    ssl_certificate     /etc/ssl/lectern/fullchain.pem;
    ssl_certificate_key /etc/ssl/lectern/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    server_tokens off;

    # server.max_upload_mb (50 MB) plus headroom: content packs are uploaded by admins.
    client_max_body_size 200m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;

    # --- API and server-rendered paths (the API sets its own security headers) ---
    location /api/auth/ {
        limit_req zone=lectern_auth burst=10 nodelay;
        proxy_pass http://lectern_api;
    }
    location /auth/ {
        limit_req zone=lectern_auth burst=10 nodelay;
        proxy_pass http://lectern_api;
    }
    location /api/      { limit_req zone=lectern_site burst=120 nodelay; proxy_pass http://lectern_api; }
    location /verify/   { limit_req zone=lectern_site burst=120 nodelay; proxy_pass http://lectern_api; }
    location /ob/       { limit_req zone=lectern_site burst=120 nodelay; proxy_pass http://lectern_api; }
    location /branding/ { limit_req zone=lectern_site burst=120 nodelay; proxy_pass http://lectern_api; }
    location = /theme.css  { proxy_pass http://lectern_api; }
    location = /server.css { proxy_pass http://lectern_api; }
    location = /healthz    { proxy_pass http://lectern_api; }
    location = /readyz     { proxy_pass http://lectern_api; }

    # --- Front-end (static files built by `npm run build`) ---
    root /var/www/lectern/current;

    # Same headers as the API sets on the pages it serves. Keep the CSP in sync with
    # server.media_origins: add the video origins to media-src and connect-src.
    set $lectern_csp "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'none'; object-src 'none'";

    # Fingerprinted bundles: cache for a year.
    location /assets/ {
        limit_req zone=lectern_site burst=120 nodelay;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $lectern_csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Client-side routes get index.html, never cached so a new release is picked up at once.
    location / {
        limit_req zone=lectern_site burst=120 nodelay;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $lectern_csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Option A — the API serves the front-end (server.static_dir). Use this block instead
    # of all the locations above:
    #
    # location /api/auth/ { limit_req zone=lectern_auth burst=10 nodelay; proxy_pass http://lectern_api; }
    # location /auth/     { limit_req zone=lectern_auth burst=10 nodelay; proxy_pass http://lectern_api; }
    # location /          { limit_req zone=lectern_site burst=120 nodelay; proxy_pass http://lectern_api; }
}
