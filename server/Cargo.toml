[package]
name = "lectern-server"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ammonia = "4.2.0"
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["macros", "multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
csv = "1.4.0"
hex = "0.4.3"
krilla = { version = "0.8.2", default-features = false, features = ["raster-images"] }
lettre = { version = "0.11.23", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "smtp-transport", "builder", "hostname", "ring", "webpki-roots"] }
minijinja = { version = "2.24.0", features = ["loader"] }
openidconnect = { version = "4.0.1", features = ["reqwest"] }
pulldown-cmark = "0.13.4"
rand = "0.10.3"
resvg = "0.48.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
skrifa = "0.42"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "trace", "set-header", "limit", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
# Deflate only (pure Rust): no bzip2, lzma, zstd, ppmd or AES code exposed to uploaded archives.
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
