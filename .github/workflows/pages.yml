name: Site

# Builds and checks the project site (site/), and publishes it to GitHub Pages from main.
on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/build-site.py", "scripts/check-site.py", "README.md", "docs/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["site/**", "scripts/build-site.py", "scripts/check-site.py", "README.md", "docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Site is up to date with its generator (README, docs, FAQ)
        run: |
          python3 scripts/build-site.py
          git diff --exit-code -- site || { echo "::error::Run python3 scripts/build-site.py and commit site/"; exit 1; }
      - name: SEO, GEO, accessibility and link checks
        run: python3 scripts/check-site.py
      - name: No brand name in the published site
        run: scripts/check-brand.sh
        env:
          BRAND_DENYLIST: ${{ vars.BRAND_DENYLIST }}
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
